app = "botpasses-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  VAULT_MODE = "hosted"
  VAULT_DEPLOY_PLANE = "staging"
  VAULT_PUBLIC_URL = "https://staging.botpasses.com"
  PORT = "8788"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 600

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
