version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
  # Actions are pinned to commit SHAs with a version comment; Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # Dockerfile FROM node:22.<minor>-bookworm-slim
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
