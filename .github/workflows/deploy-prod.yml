name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: "Full commit SHA that is green on staging (must be on dev)"
        required: true

permissions:
  contents: read
  # Reads the deploy-staging run for the SHA (the staging gate below).
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Configure the `production` environment with a required reviewer in
    # Settings -> Environments; the job waits for approval before the first step.
    # FLY_API_TOKEN is an environment secret of `production`, readable only by jobs that
    # passed that review; it is not a repository secret.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vault:vault@localhost:5432/vault
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.inputs.staging_sha }}
          fetch-depth: 0
      - name: staging_sha must be a full SHA on dev
        env:
          STAGING_SHA: ${{ github.event.inputs.staging_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$STAGING_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::staging_sha must be a full 40-character commit SHA, got '$STAGING_SHA'"
            exit 1
          fi
          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "$STAGING_SHA" origin/dev; then
            echo "::error::$STAGING_SHA is not an ancestor of origin/dev. Only commits that reached staging via dev deploy to production."
            exit 1
          fi
          echo "$STAGING_SHA is on dev"
      - name: staging_sha must have deployed to staging successfully
        # "Green on staging" is checked, not trusted: the deploy-staging workflow must have a
        # completed run for exactly this SHA whose conclusion is success.
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ github.event.inputs.staging_sha }}
        run: |
          set -euo pipefail
          successes=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/runs?head_sha=${STAGING_SHA}&status=completed&per_page=50" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${successes:-0}" -lt 1 ]; then
            echo "::error::no successful deploy-staging run for $STAGING_SHA. Let staging deploy it first, or check the deploy-staging run for that SHA."
            exit 1
          fi
          echo "$STAGING_SHA deployed to staging ($successes successful run(s))"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: scripts/audit.sh
      - run: npm --prefix site ci
      - run: scripts/audit.sh --prefix site
      - run: npm run site:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # `-a` names the app explicitly: a production-scoped token deploys botpasses-prod and
      # nothing else, whatever the toml says.
      - run: flyctl deploy --remote-only -c fly.prod.toml -a botpasses-prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
