name: deploy-staging

# Runs after the `ci` workflow succeeds on dev, instead of repeating the suite here.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only a push to dev in this repository may deploy: workflow_run also fires for fork pull
    # requests whose head branch happens to be named dev, and those must never reach staging.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'dev'
    # FLY_API_TOKEN is an environment secret of `staging` (deployment branch rule: dev only),
    # not a repository secret, so no other workflow or branch can read it.
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # A leftover stopped Machine makes flyctl "update" it and then wait 5 minutes for
      # HTTP checks that never run. Start it first so deploy rolls a running VM.
      - name: Start a stopped Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list -a botpasses-staging
          python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(
              ["flyctl", "machine", "list", "-a", "botpasses-staging", "--json"],
              text=True,
          )
          machines = json.loads(raw)
          if not machines:
              sys.exit("no machines on botpasses-staging")
          for m in machines:
              mid = m.get("id") or ""
              state = m.get("state") or ""
              if mid and state != "started":
                  print(f"starting {mid} (was {state})", flush=True)
                  subprocess.check_call(["flyctl", "machine", "start", mid, "-a", "botpasses-staging"])
          PY
      # `-a` names the app explicitly so a token scoped to that app cannot deploy elsewhere
      # and a wrong toml can never point this workflow at production.
      - run: flyctl deploy --remote-only -c fly.staging.toml -a botpasses-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait until /ready answers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -m 5 https://botpasses-staging.fly.dev/ready; then
              echo
              echo "/ready is 200"
              exit 0
            fi
            sleep 2
          done
          echo "::error::botpasses-staging.fly.dev/ready did not become 200"
          flyctl machine list -a botpasses-staging
          exit 1
      - name: Fly logs on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: timeout 20 flyctl logs -a botpasses-staging || true
