name: backup-prod

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump, encrypt, upload
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/hosted-backup.ts require-offsite-env
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump "$DATABASE_URL_DIRECT" --no-owner --format=custom --file=vault.dump
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/hosted-backup.ts encrypt vault.dump vault.dump.enc
          npm install --no-save aws4fetch
          STAMP="$STAMP" node --input-type=module <<'NODE'
          import { AwsClient } from "aws4fetch";
          import { readFileSync } from "node:fs";
          const account = process.env.R2_ACCOUNT_ID ?? "";
          const bucket = process.env.R2_BUCKET ?? "";
          const stamp = process.env.STAMP ?? "backup";
          const client = new AwsClient({
            accessKeyId: process.env.R2_ACCESS_KEY_ID ?? "",
            secretAccessKey: process.env.R2_SECRET_ACCESS_KEY ?? "",
          });
          const url = `https://${account}.r2.cloudflarestorage.com/${bucket}/botpasses-${stamp}.dump.enc`;
          const res = await client.fetch(url, { method: "PUT", body: readFileSync("vault.dump.enc") });
          if (!res.ok) throw new Error(`R2 put ${res.status}`);
          NODE
