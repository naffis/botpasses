app = "botpasses-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# One Machine per app. In-process TOTP enrollment state and per-IP limiters are not shared;
# do not `fly scale count` above 1 until they are store-backed.
kill_timeout = "30s"

[env]
  VAULT_MODE = "hosted"
  VAULT_DEPLOY_PLANE = "production"
  VAULT_PUBLIC_URL = "https://botpasses.com"
  PORT = "8788"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
